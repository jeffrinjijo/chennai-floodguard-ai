project: chennai-floodguard-ai

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  reports: reports

geo:
  metric_crs: "EPSG:32644"     # UTM 44N, metric calculations
  source_crs: "EPSG:4326"
  grid_cell_m: 500             # try 250 once the pipeline works
  # approximate core-Chennai bounding box (lon/lat) - refine with GCC boundary
  bbox: [80.15, 12.90, 80.33, 13.20]

events:
  # flood events with spatial labels
  - {name: "2005", file_hint: "2005"}
  - {name: "2015", file_hint: "2015"}
  - {name: "2020", file_hint: "2020"}

validation:
  scheme: leave_one_event_out
  metrics: [pr_auc, recall, f1, brier, ece]

model:
  xgboost:
    objective: binary:logistic
    n_estimators: 500
    learning_rate: 0.03
    max_depth: 5
    subsample: 0.8
    colsample_bytree: 0.8
  random_forest: {n_estimators: 400, max_depth: 12, class_weight: balanced}
seed: 42
